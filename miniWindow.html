<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Focus Companion</title>

  <!-- 🔗 Add your Tailwind / app CSS -->
  <link rel="stylesheet" href="/assets/index.css" />

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div id="status" class="text-lg font-semibold">Focused</div>
  <div id="timer" class="text-3xl font-bold">00:00</div>
  <div class="flex gap-3 mt-2">
    <button id="start" class="bg-indigo-600 text-white px-3 py-1 rounded-xl">Start</button>
    <button id="pause" class="bg-slate-700 text-white px-3 py-1 rounded-xl">Pause</button>
    <button id="reset" class="bg-slate-600 text-white px-3 py-1 rounded-xl">Reset</button>
    <button id="save" class="bg-emerald-600 text-white px-3 py-1 rounded-xl">Save</button>
  </div>

  <script src="/miniWindow.js"></script>
</body>
</html>
